/* =====================================================================
   BakuGo — GOOGLE MAPS ADAPTERİ
   Tətbiqdəki bütün xəritələr Google Maps ilə işləyir. Köhnə kod Leaflet
   sintaksisi (L.map, L.marker, ...) ilə yazıldığı üçün burada həmin
   funksiyalar Google Maps JavaScript API üzərində yenidən qurulub.
   Ünvan axtarışı / tərs axtarış -> Google Geocoding + Places,
   marşrut məsafəsi/vaxtı -> Google Directions (Routes API ehtiyat).
   Google Cloud-da aktiv olmalıdır: Maps JavaScript API, Geocoding API,
   Places API (New), Directions API (və ya Routes API).
   ===================================================================== */
(function(){
  'use strict';
  if (window.BGMap) return;

  var GMAPS_KEY = 'AIzaSyAQcVU7_ac2e73cMF__xd_t40Xu2kJchF4';
  var BAKU = { lat: 40.4093, lng: 49.8671 };

  var gm = null;               /* google.maps hazır olanda */
  var RL = null;               /* ehtiyat xəritə (Leaflet) — Google açarı işləməyəndə */
  var engine = null;           /* 'google' | 'leaflet' */
  var gmBad = false;           /* Google açarı rədd edildi / Google yüklənmədi */
  var readyCbs = [];
  var failed = false, failMsg = '';
  var allMaps = [];
  var _fetch = window.fetch ? window.fetch.bind(window) : null;

  var ready = new Promise(function(res, rej){
    readyCbs.push(function(err){ err ? rej(err) : res(); });
  });
  ready.catch(function(){});
  function fireReady(err){ var c = readyCbs; readyCbs = []; c.forEach(function(f){ try { f(err); } catch(e){ console.error(e); } }); }

  function setEngine(e){ engine = e; allMaps.slice().forEach(function(m){ try { m._build(); } catch(x){ console.error(x); } }); }

  /* Google işləmədi -> xəritələr avtomatik ehtiyat xəritəyə keçir (tətbiq dayanmır).
     Google açarı düzələn kimi (billing/API/domen) yenidən Google Maps açılacaq. */
  function showFail(msg){
    if (gmBad) return;
    gmBad = true; failMsg = msg;
    console.warn('⚠️ Google Maps: ' + msg + ' — müvəqqəti ehtiyat xəritə göstərilir.');
    fireReady(new Error(msg));
    loadLeaflet().then(function(){ setEngine('leaflet'); }).catch(function(){
      failed = true; allMaps.forEach(function(m){ m._showFail(); });
    });
  }
  var lfPromise = null;
  function loadLeaflet(){ /* xəritə Google Maps-dir (BGMap) */ return Promise.resolve(); }

  /* ---------- Google Maps JS API-ni yüklə ---------- */
  window.__bgGmInit = async function(){
    try {
      var libs = ['maps', 'marker', 'geocoding', 'routes', 'geometry'];
      for (var i = 0; i < libs.length; i++) { try { await google.maps.importLibrary(libs[i]); } catch(e){ console.warn('Google Maps kitabxanası yüklənmədi:', libs[i], e); } }
      try { await google.maps.importLibrary('places'); } catch(e){ console.warn('Places kitabxanası yüklənmədi', e); }
      gm = google.maps;
      buildOverlayClass();
      if (gmBad) return;
      fireReady(null);
      setEngine('google');
    } catch(e){ showFail('Google Maps başladıla bilmədi'); }
  };
  window.gm_authFailure = function(){
    showFail('Google Maps API açarı qəbul edilmədi (billing / API aktivləşdirmə / açar məhdudiyyəti yoxlanmalıdır).');
  };
  (function load(){
    var s = document.createElement('script');
    s.async = true;
    s.src = 'https://maps.googleapis.com/maps/api/js?key=' + GMAPS_KEY +
            '&v=weekly&loading=async&language=az&region=AZ&libraries=places,geometry&callback=__bgGmInit';
    s.onerror = function(){ showFail('Google Maps serverinə qoşulmaq olmadı.'); };
    (document.head || document.documentElement).appendChild(s);
    /* 15 saniyəyə Google cavab verməsə, ehtiyat xəritəyə keç */
    setTimeout(function(){ if (!engine && !gmBad) showFail('Google Maps vaxtında yüklənmədi.'); }, 15000);
  })();

  /* ---------- köməkçilər ---------- */
  function toLL(a, b){
    if (a == null) return null;
    if (typeof a === 'number' || typeof a === 'string') return { lat: parseFloat(a), lng: parseFloat(b) };
    if (Array.isArray(a)) return { lat: parseFloat(a[0]), lng: parseFloat(a[1]) };
    if (typeof a.lat === 'function') return { lat: a.lat(), lng: a.lng() };
    if (a.latLng) return toLL(a.latLng);
    return { lat: parseFloat(a.lat), lng: parseFloat(a.lng != null ? a.lng : a.lon) };
  }
  function okLL(p){ return p && isFinite(p.lat) && isFinite(p.lng); }
  function LatLng(lat, lng){ this.lat = lat; this.lng = lng; }
  LatLng.prototype.distanceTo = function(o){
    o = toLL(o); var R = 6371000, r = Math.PI / 180;
    var dLat = (o.lat - this.lat) * r, dLng = (o.lng - this.lng) * r;
    var x = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(this.lat*r) * Math.cos(o.lat*r) * Math.sin(dLng/2) * Math.sin(dLng/2);
    return R * 2 * Math.atan2(Math.sqrt(x), Math.sqrt(1 - x));
  };
  LatLng.prototype.equals = function(o){ o = toLL(o); return o && Math.abs(o.lat - this.lat) < 1e-9 && Math.abs(o.lng - this.lng) < 1e-9; };
  function mkLL(p){ return p ? new LatLng(p.lat, p.lng) : null; }
  function padNum(p){ if (p == null) return 0; return Array.isArray(p) ? Math.max(+p[0] || 0, +p[1] || 0) : (+p || 0); }

  /* Kiçik hadisə sistemi (Leaflet-dəki .on/.off/.fire) */
  function Evented(){}
  Evented.prototype.on = function(t, fn){ var self = this; String(t).split(/\s+/).forEach(function(k){ if (!k) return; (self._ev = self._ev || {})[k] = (self._ev[k] || []).concat([fn]); if (self._onBind) self._onBind(k); }); return this; };
  Evented.prototype.once = function(t, fn){ var self = this; var w = function(e){ self.off(t, w); fn.call(self, e); }; return this.on(t, w); };
  Evented.prototype.off = function(t, fn){ if (!this._ev) return this; if (!t) { this._ev = {}; return this; } if (!fn) delete this._ev[t]; else this._ev[t] = (this._ev[t] || []).filter(function(f){ return f !== fn; }); return this; };
  Evented.prototype.fire = function(t, e){ var self = this; e = e || {}; e.type = t; e.target = this; ((this._ev && this._ev[t]) || []).slice().forEach(function(f){ try { f.call(self, e); } catch(x){ console.error(x); } }); return this; };
  Evented.prototype.listens = function(t){ return !!(this._ev && this._ev[t] && this._ev[t].length); };
  function inherit(C, P){ C.prototype = Object.create(P.prototype); C.prototype.constructor = C; }

  /* Gecə rejimi stili */
  var DARK_STYLE = [
    { elementType: 'geometry', stylers: [{ color: '#1d2230' }] },
    { elementType: 'labels.text.stroke', stylers: [{ color: '#1d2230' }] },
    { elementType: 'labels.text.fill', stylers: [{ color: '#8a93a6' }] },
    { featureType: 'administrative.locality', elementType: 'labels.text.fill', stylers: [{ color: '#d4af37' }] },
    { featureType: 'poi', elementType: 'labels.text.fill', stylers: [{ color: '#a08a4a' }] },
    { featureType: 'poi.park', elementType: 'geometry', stylers: [{ color: '#1f3a2e' }] },
    { featureType: 'road', elementType: 'geometry', stylers: [{ color: '#343b4d' }] },
    { featureType: 'road', elementType: 'geometry.stroke', stylers: [{ color: '#202533' }] },
    { featureType: 'road', elementType: 'labels.text.fill', stylers: [{ color: '#a3acc0' }] },
    { featureType: 'road.highway', elementType: 'geometry', stylers: [{ color: '#5a4a1f' }] },
    { featureType: 'road.highway', elementType: 'geometry.stroke', stylers: [{ color: '#2b2412' }] },
    { featureType: 'transit', elementType: 'geometry', stylers: [{ color: '#2a3040' }] },
    { featureType: 'water', elementType: 'geometry', stylers: [{ color: '#0f1726' }] },
    { featureType: 'water', elementType: 'labels.text.fill', stylers: [{ color: '#4e6d8c' }] }
  ];

  /* Premium gündüz stili: yumşaq, təmiz, reklam/biznes nişanları gizli */
  var LIGHT_STYLE = [
    { elementType: 'geometry', stylers: [{ color: '#f5f3ef' }] },
    { elementType: 'labels.text.fill', stylers: [{ color: '#5f6670' }] },
    { elementType: 'labels.text.stroke', stylers: [{ color: '#ffffff' }, { weight: 3 }] },
    { featureType: 'poi.business', stylers: [{ visibility: 'off' }] },
    { featureType: 'poi', elementType: 'labels.icon', stylers: [{ saturation: -60 }, { lightness: 10 }] },
    { featureType: 'poi.park', elementType: 'geometry', stylers: [{ color: '#dfeedd' }] },
    { featureType: 'road', elementType: 'geometry', stylers: [{ color: '#ffffff' }] },
    { featureType: 'road', elementType: 'geometry.stroke', stylers: [{ color: '#e6e1d8' }] },
    { featureType: 'road.highway', elementType: 'geometry', stylers: [{ color: '#ffe2b8' }] },
    { featureType: 'road.highway', elementType: 'geometry.stroke', stylers: [{ color: '#f3c98a' }] },
    { featureType: 'transit', elementType: 'geometry', stylers: [{ color: '#ece8e1' }] },
    { featureType: 'water', elementType: 'geometry', stylers: [{ color: '#bfdcef' }] },
    { featureType: 'water', elementType: 'labels.text.fill', stylers: [{ color: '#5d8fb0' }] }
  ];
  function mapStyles(st){ return st.satellite ? null : (st.dark ? DARK_STYLE : LIGHT_STYLE); }
  /* Premium marker (narıncı qradiyent damla + ağ nüvə) */
  var PIN_URL = 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(
    "<svg xmlns='http://www.w3.org/2000/svg' width='40' height='52' viewBox='0 0 40 52'><defs>" +
    "<linearGradient id='g' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='#ffb347'/><stop offset='1' stop-color='#ff5722'/></linearGradient>" +
    "<filter id='s' x='-30%' y='-20%' width='160%' height='150%'><feDropShadow dx='0' dy='3' stdDeviation='2.5' flood-color='#000' flood-opacity='.35'/></filter></defs>" +
    "<path filter='url(#s)' d='M20 2C10.6 2 3 9.6 3 19c0 12.4 14.6 27.6 15.9 28.9.6.6 1.6.6 2.2 0C22.4 46.6 37 31.4 37 19 37 9.6 29.4 2 20 2z' fill='url(#g)' stroke='#fff' stroke-width='2.5'/>" +
    "<circle cx='20' cy='19' r='6.5' fill='#fff'/><circle cx='20' cy='19' r='3' fill='#ff5722'/></svg>");

  /* =================== XƏRİTƏ =================== */
  function GMap(el, opts){
    if (typeof el === 'string') el = document.getElementById(el);
    if (!el) throw new Error('Xəritə konteyneri tapılmadı');
    this._el = el; this._o = opts || {};
    this._center = toLL(this._o.center) || { lat: BAKU.lat, lng: BAKU.lng };
    this._zoom = this._o.zoom != null ? this._o.zoom : 13;
    this._layers = []; this._g = null; this._removed = false;
    this._style = { dark: true, satellite: false };
    this._pendingFit = null; this._gl = [];
    allMaps.push(this);
    var self = this;
    if (failed) this._showFail(); else if (engine) this._build();
  }
  inherit(GMap, Evented);
  GMap.prototype._build = function(){
    if (this._removed) return;
    if (engine === 'leaflet') { this._teardownG(); this._createLf(); }
    else if (engine === 'google') this._create();
  };
  GMap.prototype._teardownG = function(){
    if (!this._g) return;
    var self = this;
    this._layers.slice().forEach(function(l){ try { l._detach(self); } catch(e){} });
    this._gl.forEach(function(h){ try { h.remove(); } catch(e){} }); this._gl = [];
    try { if (this._ro) this._ro.disconnect(); } catch(e){}
    try { this._iw.close(); } catch(e){}
    this._g = null; this._iw = null; this._bound = {};
    try { this._el.innerHTML = ''; } catch(e){}
  };
  var LF_TILES = {
    street: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
    sat: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'
  };
  GMap.prototype._createLf = function(){
    if (this._removed || this._lf || !RL) return;
    var self = this;
    this._lf = RL.map(this._el, { zoomControl: false }).setView([this._center.lat, this._center.lng], this._zoom);
    this._applyLfTiles();
    this._lf.on('click', function(e){ self.fire('click', { latlng: mkLL(toLL(e.latlng)) }); });
    this._lf.on('moveend', function(){ if (!self._lf) return; var c = self._lf.getCenter(); self._center = { lat: c.lat, lng: c.lng }; self._zoom = self._lf.getZoom(); });
    ['zoomend', 'moveend', 'dragstart', 'movestart', 'dragend'].forEach(function(t){ if (self.listens(t)) self._bindLf(t); });
    this._layers.slice().forEach(function(l){ l._attach(self); });
    var fix = function(){ try { if (self._lf) { self._lf.invalidateSize(); self._applyPendingFit(); } } catch(e){} };
    [150, 600, 1500].forEach(function(t){ setTimeout(fix, t); });
    try { if (window.ResizeObserver) { this._ro = new ResizeObserver(fix); this._ro.observe(this._el); } } catch(e){}
    this._applyPendingFit();
    this._decorate();
    this.fire('load');
  };
  GMap.prototype._applyLfTiles = function(){
    if (!this._lf) return;
    if (this._tile) { try { this._lf.removeLayer(this._tile); } catch(e){} }
    var sat = this._style.satellite, dark = this._style.dark && !sat;
    this._tile = RL.tileLayer(sat ? LF_TILES.sat : LF_TILES.street, { maxZoom: 19, attribution: '&copy; Esri, OpenStreetMap', className: dark ? 'bg-lf-dark' : (sat ? '' : 'bg-lf-light') }).addTo(this._lf);
  };
  GMap.prototype._bindLf = function(t){
    var self = this; this._boundLf = this._boundLf || {};
    if (this._boundLf[t]) return; this._boundLf[t] = true;
    this._lf.on(t, function(){ self.fire(t); });
  };
  GMap.prototype._create = function(){
    if (this._removed || this._g) return;
    var self = this, o = this._o;
    if (getComputedStyle(this._el).position === 'static') this._el.style.position = 'relative';
    this._g = new gm.Map(this._el, {
      center: this._center, zoom: this._zoom,
      disableDefaultUI: true, zoomControl: false,
      gestureHandling: 'greedy', clickableIcons: false, keyboardShortcuts: false,
      mapTypeId: this._style.satellite ? 'hybrid' : 'roadmap',
      styles: mapStyles(this._style)
    });
    this._iw = new gm.InfoWindow();
    this._gl.push(this._g.addListener('click', function(e){ self._iw.close(); self._iwOwner = null; self.fire('click', { latlng: mkLL(toLL(e.latLng)) }); }));
    this._gl.push(this._g.addListener('idle', function(){ var c = self._g.getCenter(); if (c) self._center = toLL(c); self._zoom = self._g.getZoom(); }));
    ['zoomend', 'moveend', 'dragstart', 'movestart', 'dragend'].forEach(function(t){ if (self.listens(t)) self._bindG(t); });
    try {
      if (window.ResizeObserver) { this._ro = new ResizeObserver(function(){ self._applyPendingFit(); }); this._ro.observe(this._el); }
    } catch(e){}
    this._layers.slice().forEach(function(l){ l._attach(self); });
    if (this._pendingFit) this._applyPendingFit();
    this._decorate();
    this.fire('load');
  };
  /* =================== PREMIUM ŞÜŞƏ QAT =================== */
  function mk(cls, html){ var d = document.createElement('div'); d.className = cls; if (html) d.innerHTML = html; return d; }
  function stopMap(el){ ['mousedown', 'touchstart', 'dblclick', 'pointerdown', 'wheel', 'click'].forEach(function(t){ el.addEventListener(t, function(e){ e.stopPropagation(); }, { passive: true }); }); }
  GMap.prototype._decorate = function(){
    var el = this._el, self = this;
    try {
      el.classList.add('bg-map-premium');
      this._syncDark();
      var big = el.offsetHeight >= 480;                     /* tam ekran xəritə (kuryer) */
      el.classList.toggle('bg-map-full', big);
      /* 1) yüklənmə parıltısı */
      var loader = mk('bg-map-loader', '<div class="bg-map-loader-ring"></div>');
      el.appendChild(loader);
      var hide = function(){ if (loader.parentNode) { loader.classList.add('done'); setTimeout(function(){ try { loader.remove(); } catch(e){} }, 600); } };
      if (this._g) gm.event.addListenerOnce(this._g, 'tilesloaded', hide);
      if (this._tile && this._tile.once) this._tile.once('load', hide);
      setTimeout(hide, 4500);
      /* 2) buzlu şüşə çərçivə, 3) şüşə işıqlar, 4) keçən parıltı, 5) animasiyalı qızılı haşiyə */
      el.appendChild(mk('bg-map-bezel'));
      el.appendChild(mk('bg-map-glass'));
      el.appendChild(mk('bg-map-sheen'));
      el.appendChild(mk('bg-map-border'));
      /* 6) canlı nişan (kiçik xəritələrdə) */
      if (!big) el.appendChild(mk('bg-map-badge', '<i></i><b>BakuGo</b><span>Canlı xəritə</span>'));
      /* 7) şüşə idarə paneli: + / − / mənim yerim */
      if (this._o.zoomControl !== false) {
        var z = mk('bg-map-zoom',
          '<button type="button" aria-label="Yaxınlaşdır">+</button><span></span>' +
          '<button type="button" aria-label="Uzaqlaşdır">&minus;</button><span></span>' +
          '<button type="button" class="bg-loc" aria-label="Mənim yerim"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>');
        var bs = z.querySelectorAll('button');
        bs[0].addEventListener('click', function(e){ e.preventDefault(); self.zoomIn(); });
        bs[1].addEventListener('click', function(e){ e.preventDefault(); self.zoomOut(); });
        if (bs[2]) bs[2].addEventListener('click', function(e){ e.preventDefault(); self._locate(bs[2]); });
        stopMap(z);
        el.appendChild(z);
      }
    } catch(e){}
  };
  GMap.prototype._locate = function(btn){
    var self = this;
    if (!navigator.geolocation) return;
    btn.classList.add('busy');
    navigator.geolocation.getCurrentPosition(function(pos){
      btn.classList.remove('busy');
      var p = [pos.coords.latitude, pos.coords.longitude];
      if (!self._me) self._me = new Marker(p, { icon: new DivIcon({ className: '', html: '<div class="bg-me-dot"><i></i></div>', iconSize: [22, 22], iconAnchor: [11, 11] }) }).addTo(self);
      else self._me.setLatLng(p);
      self.flyTo(p, Math.max(self.getZoom() || 15, 16));
    }, function(){ btn.classList.remove('busy'); btn.classList.add('err'); setTimeout(function(){ btn.classList.remove('err'); }, 900); },
    { enableHighAccuracy: true, timeout: 8000, maximumAge: 15000 });
  };
  GMap.prototype._syncDark = function(){
    try { this._el.classList.toggle('bg-map-dark', !!(this._style.dark || this._style.satellite)); } catch(e){}
  };
  var G_EVT = { zoomend: 'zoom_changed', moveend: 'idle', dragstart: 'dragstart', movestart: 'dragstart', dragend: 'dragend' };
  GMap.prototype._onBind = function(t){ if (this._g && G_EVT[t]) this._bindG(t); if (this._lf && G_EVT[t]) this._bindLf(t); };
  GMap.prototype._bindG = function(t){
    var self = this; this._bound = this._bound || {};
    if (this._bound[t]) return; this._bound[t] = true;
    this._gl.push(this._g.addListener(G_EVT[t], function(){ self.fire(t); }));
  };
  GMap.prototype._showFail = function(){
    try {
      if (this._removed) return;
      this._el.innerHTML = '<div style="height:100%;min-height:120px;display:flex;align-items:center;justify-content:center;padding:14px;text-align:center;font:13px/1.45 sans-serif;color:#666;background:#f1f1f1;">' +
        'Xəritə yüklənmədi. ' + (failMsg || '') + '</div>';
    } catch(e){}
  };
  GMap.prototype.whenReady = function(fn){ var self = this; if (this._g || this._lf) fn.call(self); else this.once('load', function(){ fn.call(self); }); return this; };
  GMap.prototype.getContainer = function(){ return this._el; };
  GMap.prototype.setView = function(c, z){
    var p = toLL(c); if (okLL(p)) this._center = p; if (z != null) this._zoom = z;
    this._pendingFit = null;
    if (this._g) { if (okLL(p)) this._g.setCenter(p); if (z != null) this._g.setZoom(z); }
    if (this._lf) { if (okLL(p)) this._lf.setView([p.lat, p.lng], z != null ? z : this._lf.getZoom()); else if (z != null) this._lf.setZoom(z); }
    return this;
  };
  GMap.prototype.panTo = function(c){ var p = toLL(c); if (!okLL(p)) return this; this._center = p; if (this._g) this._g.panTo(p); if (this._lf) this._lf.panTo([p.lat, p.lng]); return this; };
  GMap.prototype.flyTo = function(c, z){ var p = toLL(c); if (!okLL(p)) return this; this._center = p; if (z != null) this._zoom = z; if (this._g) { this._g.panTo(p); if (z != null) this._g.setZoom(z); } if (this._lf) this._lf.flyTo([p.lat, p.lng], z != null ? z : this._lf.getZoom()); return this; };
  GMap.prototype.setZoom = function(z){ this._zoom = z; if (this._g) this._g.setZoom(z); if (this._lf) this._lf.setZoom(z); return this; };
  GMap.prototype.getZoom = function(){ return this._g ? this._g.getZoom() : this._lf ? this._lf.getZoom() : this._zoom; };
  GMap.prototype.zoomIn = function(){ return this.setZoom(this.getZoom() + 1); };
  GMap.prototype.zoomOut = function(){ return this.setZoom(this.getZoom() - 1); };
  GMap.prototype.getCenter = function(){ var c = this._g ? this._g.getCenter() : this._lf ? this._lf.getCenter() : null; return mkLL(c ? toLL(c) : this._center); };
  GMap.prototype.getBounds = function(){
    if (this._lf) { var lb = this._lf.getBounds(); return { getSouthWest: function(){ return mkLL(toLL(lb.getSouthWest())); }, getNorthEast: function(){ return mkLL(toLL(lb.getNorthEast())); }, contains: function(p){ p = toLL(p); return lb.contains([p.lat, p.lng]); } }; }
    var b = this._g && this._g.getBounds(); if (!b) return null;
    var sw = toLL(b.getSouthWest()), ne = toLL(b.getNorthEast());
    return { getSouthWest: function(){ return mkLL(sw); }, getNorthEast: function(){ return mkLL(ne); },
      contains: function(p){ p = toLL(p); return b.contains(p); } };
  };

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>BakuGo Admin</title>
<meta name="theme-color" content="#07080D">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BakuGo Admin">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">


<style>
:root{
  --ink:#12141C;
  --ink-soft:#1B1E2B;
  --ink-line:#2B2F41;
  --accent:#FF5722;
  --accent-dark:#E64A19;
  --accent-soft:#FFF0E9;
  --bg:#F5F6FA;
  --surface:#FFFFFF;
  --border:#E7E9F0;
  --text:#171923;
  --text-muted:#767C8C;
  --success:#16A34A;
  --success-soft:#E8F8EE;
  --warning:#B8760A;
  --warning-soft:#FFF6E3;
  --danger:#E11D48;
  --danger-soft:#FDEAF0;
  --radius-lg:18px;
  --radius-md:12px;
  --shadow:0 8px 24px rgba(18,20,28,.06);
  --shadow-lift:0 16px 32px rgba(18,20,28,.10);
}

*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{
  font-family:'Inter',sans-serif;
  background:var(--bg);
  color:var(--text);
  overflow:hidden;
}
h1,h2,h3,.display{font-family:'Sora',sans-serif;}
button{font-family:inherit;}
::selection{background:var(--accent-soft);color:var(--accent-dark);}

/* ---------- APP SHELL ---------- */
.app-shell{display:flex;height:100vh;}

/* ---------- SIDEBAR & MOBILE MENU ---------- */
.sidebar{
  width:252px;
  flex-shrink:0;
  background:var(--ink);
  color:#fff;
  padding:24px 16px;
  display:flex;
  flex-direction:column;
  z-index: 100;
  transition: left 0.3s ease;
  /* Menyu uzun olanda yuxarı-aşağı sürüşdürmək üçün (kənar scroll zolağı) */
  overflow-y: auto;
  overflow-x: hidden;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: thin;
  scrollbar-color: #4a4f66 transparent;
  padding-bottom: 28px;
}
.sidebar > *{flex-shrink:0;}
.sidebar::-webkit-scrollbar{width:6px;}
.sidebar::-webkit-scrollbar-thumb{background:#4a4f66;border-radius:6px;}
.sidebar::-webkit-scrollbar-track{background:transparent;}
.sidebar-overlay {
  display: none;
  position: fixed; inset: 0; background: rgba(18,20,28,.5); z-index: 90;
}
.logo{display:flex;align-items:center;gap:10px;padding:6px 10px 28px;}
.logo-mark{
  width:34px;height:34px;
  border-radius:9px;
  background:var(--accent);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.logo-mark svg{width:18px;height:18px;stroke:#fff;}
.logo-text{font-size:19px;font-weight:700;letter-spacing:.2px;}
.logo-text span{color:var(--accent);}
.nav-label{
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.08em;
  color:#6E7386;
  padding:0 12px 8px;
  margin-top:6px;
}
.menu{display:flex;flex-direction:column;gap:2px;}
.menu button{
  display:flex;
  align-items:center;
  gap:12px;
  width:100%;
  padding:11px 12px;
  border:none;
  border-radius:10px;
  background:transparent;
  color:#B7BACB;
  cursor:pointer;
  font-size:14.5px;
  font-weight:500;
  text-align:left;
  transition:background .15s ease, color .15s ease;
}
.menu button svg{width:18px;height:18px;stroke:currentColor;flex-shrink:0;}
.menu button:hover{background:var(--ink-soft);color:#fff;}
.menu button.active{background:var(--accent);color:#fff;}
.menu button .nav-badge{
  margin-left:auto;background:rgba(255,255,255,.18);color:#fff;
  font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:20px;
}
.menu button.active .nav-badge{background:rgba(255,255,255,.28);}
.sidebar-footer{
  margin-top:auto;
  padding:14px 12px;
  border-radius:12px;
  background:var(--ink-soft);
  border:1px solid var(--ink-line);
}
.sidebar-footer p{font-size:12.5px;color:#9195A7;line-height:1.5;}
.sidebar-footer b{color:#fff;display:block;font-size:13px;margin-bottom:2px;}
.sf-status{display:flex;align-items:center;gap:7px;margin-bottom:6px;}
.sf-status .dot{width:7px;height:7px;border-radius:50%;background:var(--success);box-shadow:0 0 0 3px rgba(22,163,74,.18);flex-shrink:0;}
.sf-status.bad .dot{background:var(--danger);box-shadow:0 0 0 3px rgba(225,29,72,.18);}
.logout-link{
  display:flex;align-items:center;gap:8px;
  margin-top:10px;
  background:transparent;border:none;color:#9195A7;
  font-size:12.5px;font-weight:600;cursor:pointer;padding:0;
}
.logout-link:hover{color:#fff;}
.logout-link svg{width:14px;height:14px;stroke:currentColor;}

/* ---------- MAIN MAIN ---------- */
.main{flex:1;padding:22px 28px 28px;overflow-y:auto;}
.topbar{
  background:var(--surface);
  padding:14px 18px;
  border-radius:var(--radius-lg);
  display:flex;
  justify-content:space-between;
  align-items:center;
  box-shadow:var(--shadow);
  gap:16px;
}
.hamburger {
  display: none;
  background: none;
  border: none;
  cursor: pointer;
  padding: 4px;
  flex-shrink: 0;
}
.hamburger svg { width: 24px; height: 24px; stroke: var(--text); }

.search-wrap{position:relative;width:100%;max-width:360px;}
.search-wrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--text-muted);}
.search{
  width:100%;
  padding:11px 14px 11px 40px;
  border-radius:10px;
  border:1px solid var(--border);
  outline:none;
  font-size:14px;
  background:var(--bg);
  transition:border-color .15s ease, background .15s ease;
}
.search:focus{border-color:var(--accent);background:var(--surface);}
.topbar-right{display:flex;align-items:center;gap:18px;flex-shrink:0;margin-left: auto;}
.icon-btn{
  width:38px;height:38px;
  border-radius:10px;
  border:1px solid var(--border);
  background:var(--surface);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  position:relative;
  transition:background .15s ease;
}
.icon-btn:hover{background:var(--bg);}
.icon-btn svg{width:17px;height:17px;stroke:var(--text-muted);}
.icon-btn .dot{
  position:absolute;top:8px;right:8px;
  width:7px;height:7px;border-radius:50%;
  background:var(--accent);
  border:1.5px solid var(--surface);
}
.profile{display:flex;align-items:center;gap:10px;padding-left:14px;border-left:1px solid var(--border);cursor:default;}
.profile-text b{font-size:13.5px;display:block;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.profile-text span{font-size:12px;color:var(--text-muted);}
.avatar{
  width:38px;height:38px;
  border-radius:10px;
  background:var(--ink);
  display:flex;justify-content:center;align-items:center;
  color:#fff;font-weight:700;font-size:14px;
  font-family:'Sora',sans-serif;
  flex-shrink:0;
}

/* ---------- SECTION HEADER ---------- */
.section-head{
  margin-top:26px;
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  flex-wrap:wrap;
  gap:12px;
}
.section-head h1{font-size:23px;font-weight:700;}
.section-head p{color:var(--text-muted);font-size:13.5px;margin-top:4px;}
.btn-primary{
  padding:11px 18px;
  background:var(--accent);
  color:#fff;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-size:13.5px;
  font-weight:600;
  display:inline-flex;
  align-items:center;
  gap:8px;
  transition:background .15s ease, transform .15s ease;
}
.btn-primary svg{width:15px;height:15px;stroke:#fff;}
.btn-primary:hover{background:var(--accent-dark);transform:translateY(-1px);}
.btn-primary:disabled{opacity:.6;cursor:not-allowed;transform:none;}
.btn-secondary{
  padding:10px 16px;
  background:var(--surface);
  color:var(--text);
  border:1px solid var(--border);
  border-radius:10px;
  cursor:pointer;
  font-size:13.5px;
  font-weight:600;
}
.btn-secondary:hover{background:var(--bg);}
.btn-secondary svg{width:15px;height:15px;stroke:var(--text);vertical-align:-3px;margin-right:2px;}
.btn-ghost-danger{
  padding:8px 12px;background:transparent;border:1px solid var(--danger-soft);color:var(--danger);
  border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;
}
.btn-ghost-danger:hover{background:var(--danger-soft);}
.btn-ghost-success{
  padding:8px 12px;background:transparent;border:1px solid var(--success-soft);color:var(--success);
  border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;
}
.btn-ghost-success:hover{background:var(--success-soft);}
.btn-ghost{
  padding:8px 12px;background:transparent;border:1px solid var(--border);color:var(--text-muted);
  border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;
}
.btn-ghost:hover{background:var(--bg);color:var(--text);}
.row-actions{display:flex;gap:6px;flex-wrap:wrap;}

/* ---------- STAT CARDS ---------- */
.cards{
  margin-top:18px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:16px;
}
.card{
  background:var(--surface);
  padding:20px;
  border-radius:var(--radius-lg);
  box-shadow:var(--shadow);
  transition:transform .2s ease, box-shadow .2s ease;
}
.card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lift);}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;}
.card-icon{
  width:36px;height:36px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  background:var(--accent-soft);
}
.card-icon svg{width:18px;height:18px;stroke:var(--accent-dark);}
.card h3{font-size:13px;color:var(--text-muted);font-weight:500;margin-top:14px;}
.card .value{font-size:30px;font-weight:700;margin-top:4px;}
.trend{font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:4px;margin-top:8px;}
.trend.up{color:var(--success);}
.trend.down{color:var(--danger);}
.trend.flat{color:var(--text-muted);}

/* ---------- BIG BOX / TABLE ---------- */
.bigBox{
  margin-top:20px;
  background:var(--surface);
  padding:22px;
  border-radius:var(--radius-lg);
  box-shadow:var(--shadow);
}
.bigBox-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
.bigBox-head h2{font-size:16.5px;font-weight:700;}
.tabs{display:flex;gap:6px;background:var(--bg);padding:4px;border-radius:10px;}
.tabs button{
  border:none;background:transparent;padding:7px 13px;border-radius:8px;
  font-size:12.5px;font-weight:600;color:var(--text-muted);cursor:pointer;
}
.tabs button.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow);}
table{width:100%;border-collapse:collapse;}
thead th{
  text-align:left;
  font-size:11.5px;
  text-transform:uppercase;
  letter-spacing:.05em;
  color:var(--text-muted);
  font-weight:600;
  padding:10px 12px;
  border-bottom:1px solid var(--border);
}
tbody td{
  padding:14px 12px;
  font-size:13.5px;
  border-bottom:1px solid var(--border);
  vertical-align:middle;
}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:var(--bg);}
.cell-user{display:flex;align-items:center;gap:10px;}
.mini-avatar{
  width:30px;height:30px;border-radius:8px;background:var(--ink);
  color:#fff;font-size:12px;font-weight:700;font-family:'Sora',sans-serif;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.badge{
  display:inline-flex;align-items:center;gap:5px;
  padding:5px 10px;border-radius:20px;
  font-size:11.5px;font-weight:700;
  white-space:nowrap;
  border:none;cursor:default;
}
.badge.success{background:var(--success-soft);color:var(--success);}
.badge.warning{background:var(--warning-soft);color:var(--warning);}
.badge.danger{background:var(--danger-soft);color:var(--danger);}
.badge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;}
.badge.clickable{cursor:pointer;}
.badge.clickable:hover{filter:brightness(0.95);}
.badge.neutral{background:#EEF0F6;color:#4B5165;}

/* ---------- ROUTE TRACKER ---------- */
.route{display:flex;align-items:center;min-width:150px;}
.route .stage{
  width:9px;height:9px;border-radius:50%;
  background:var(--border);
  flex-shrink:0;
  position:relative;
  z-index:1;
}
.route .stage.done{background:var(--accent);}
.route .stage.current{
  background:var(--accent);
  box-shadow:0 0 0 4px var(--accent-soft);
}
.route .link{flex:1;height:2px;background:var(--border);}
.route .link.done{background:var(--accent);}
.route.cancelled .stage{background:var(--border);}
.route.cancelled .stage.hit{background:var(--danger);}
.route.cancelled .link{background:var(--border);}
.route.cancelled .link.hit{background:none;border-top:2px dashed var(--danger);height:0;}
.route-label{font-size:11px;color:var(--text-muted);margin-top:5px;}

/* ---------- GRID CARDS ---------- */
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-top:4px;}
.entity-card{
  border:1px solid var(--border);
  border-radius:14px;
  padding:16px;
  transition:border-color .15s ease, transform .15s ease;
}
.entity-card:hover{border-color:var(--accent);transform:translateY(-2px);}
.entity-card.blocked-card{border-color:var(--danger);background:var(--danger-soft);}
.entity-top{display:flex;justify-content:space-between;align-items:flex-start;}
.status-dot{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--success);background:none;border:none;cursor:pointer;padding:0;}
.status-dot .d{width:7px;height:7px;border-radius:50%;background:var(--success);}
.status-dot.off{color:var(--text-muted);}
.status-dot.off .d{background:var(--text-muted);}
.entity-card h4{font-size:14.5px;margin-top:12px;font-weight:600;}
.entity-card .meta{font-size:12px;color:var(--text-muted);margin-top:2px;}
.entity-stats{display:flex;gap:16px;margin-top:14px;padding-top:12px;border-top:1px solid var(--border);}
.entity-stats div{font-size:12px;color:var(--text-muted);}
.entity-stats b{display:block;font-size:14.5px;color:var(--text);font-family:'Sora',sans-serif;}
.entity-foot{display:flex;gap:6px;margin-top:12px;}

/* ---------- CHART CANVAS WRAP ---------- */
.chart-wrap{position:relative;width:100%;height:220px;margin-top:12px;}

/* ---------- SETTINGS ---------- */
.settings-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:16px 4px;border-bottom:1px solid var(--border);
}
.settings-row:last-child{border-bottom:none;}
.settings-row h4{font-size:14px;font-weight:600;}
.settings-row p{font-size:12.5px;color:var(--text-muted);margin-top:3px;}
.switch{width:42px;height:24px;border-radius:20px;background:var(--border);position:relative;cursor:pointer;flex-shrink:0;transition:background .2s ease;}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .2s ease;box-shadow:0 1px 3px rgba(0,0,0,.2);}
.switch.on{background:var(--accent);}
.switch.on::after{left:21px;}
.field-group{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-top:14px;}
.field label{font-size:12.5px;font-weight:600;color:var(--text-muted);display:block;margin-bottom:6px;}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border-radius:9px;border:1px solid var(--border);font-size:13.5px;outline:none;background:var(--surface);font-family:inherit;resize:vertical;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);}

/* ===== PREMIUM REKLAM KARTI ===== */
.adx-card{position:relative;width:100%;max-width:380px;border-radius:28px;overflow:hidden;background:#0d1018;color:#fff;box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.08);font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;text-align:left;}
.adx-media{position:relative;height:210px;background:var(--adx-bg);overflow:hidden;}
.adx-media img{width:100%;height:100%;object-fit:cover;display:block;}
.adx-media::after{content:'';position:absolute;left:0;right:0;bottom:0;height:90px;background:linear-gradient(to top,#0d1018,rgba(13,16,24,0));pointer-events:none;}
.adx-orb{position:absolute;border-radius:50%;background:rgba(255,255,255,.5);opacity:.3;}
.adx-orb.o1{width:190px;height:190px;right:-55px;top:-65px;}
.adx-orb.o2{width:120px;height:120px;left:-35px;bottom:-35px;opacity:.2;}
.adx-icon{position:absolute;left:0;right:0;top:0;bottom:0;display:flex;align-items:center;justify-content:center;font-size:78px;filter:drop-shadow(0 10px 24px rgba(0,0,0,.35));}
.adx-badge{position:absolute;left:14px;top:14px;z-index:3;padding:5px 11px;border-radius:999px;background:rgba(0,0,0,.38);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);font-size:10.5px;font-weight:800;letter-spacing:1.4px;color:#fff;border:1px solid rgba(255,255,255,.2);}
.adx-close{position:absolute;right:12px;top:12px;z-index:4;width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.22);background:rgba(0,0,0,.45);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#fff;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;font-family:inherit;}
.adx-close.wait{cursor:default;font-size:13px;}
.adx-body{padding:4px 22px 22px;position:relative;z-index:2;margin-top:-6px;}
.adx-title{font-family:'Playfair Display',Georgia,serif;font-size:24px;font-weight:800;line-height:1.2;margin:0 0 8px;letter-spacing:.2px;color:#fff;}
.adx-text{font-size:14px;line-height:1.55;color:rgba(255,255,255,.74);margin:0 0 18px;white-space:pre-line;word-break:break-word;}
.adx-cta{position:relative;overflow:hidden;width:100%;border:0;border-radius:16px;padding:15px 18px;font-size:15px;font-weight:800;color:#fff;background:var(--adx-bg);cursor:pointer;box-shadow:0 10px 26px rgba(0,0,0,.4);font-family:inherit;letter-spacing:.3px;}
.adx-cta::after{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.42),transparent);transform:skewX(-20deg);animation:adxShine 3.2s ease-in-out infinite;}
@keyframes adxShine{0%{left:-60%}55%,100%{left:130%}}
.adx-skip{display:block;margin:12px auto 0;background:none;border:0;color:rgba(255,255,255,.5);font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;padding:6px 12px;}
.adx-skip[hidden]{display:none;}

/* ===== REKLAM SƏHİFƏSİ (admin) ===== */
.ad-layout{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.75fr);gap:18px;align-items:start;margin-top:18px;}
@media(max-width:1000px){.ad-layout{grid-template-columns:1fr;}}
.ad-form{display:flex;flex-direction:column;gap:14px;padding-top:6px;}
.ad-themes{display:flex;gap:10px;flex-wrap:wrap;}
.ad-theme{width:40px;height:40px;border-radius:12px;cursor:pointer;border:0;outline:2px solid transparent;outline-offset:2px;transition:transform .15s ease,outline-color .15s ease;}
.ad-theme:hover{transform:translateY(-2px);}
.ad-theme.sel{outline-color:var(--accent);}
.ad-upload{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.ad-upload input[type=file]{display:none;}
.ad-upload-status{font-size:12px;color:var(--text-muted);}
.ad-send{width:100%;border:0;border-radius:14px;padding:16px 18px;font-size:15.5px;font-weight:800;color:#fff;cursor:pointer;font-family:'Sora',sans-serif;letter-spacing:.2px;background:linear-gradient(135deg,#FF5722 0%,#FF8A3D 55%,#FFB24D 100%);box-shadow:0 14px 28px rgba(255,87,34,.32);transition:transform .15s ease,box-shadow .15s ease;display:flex;align-items:center;justify-content:center;gap:10px;}
.ad-send:hover{transform:translateY(-2px);box-shadow:0 18px 34px rgba(255,87,34,.4);}
.ad-send:disabled{opacity:.65;cursor:not-allowed;transform:none;}
.ad-actions-row{display:flex;gap:10px;flex-wrap:wrap;}
.ad-actions-row .btn-secondary{flex:1;min-width:140px;}
.ad-edit-banner{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--warning-soft);color:var(--warning);border-radius:12px;padding:10px 14px;font-size:13px;font-weight:600;}
.ad-pv-wrap{position:sticky;top:12px;}
.ad-pv-phone{background:#06070b;border-radius:38px;padding:12px;max-width:340px;margin:0 auto;box-shadow:0 24px 50px rgba(18,20,28,.28);}
.ad-pv-screen{border-radius:28px;background:radial-gradient(circle at 50% 30%,#1b2238 0%,#080b14 75%);min-height:520px;display:flex;align-items:center;justify-content:center;padding:16px 12px;}
.ad-pv-note{font-size:12px;color:var(--text-muted);text-align:center;margin-top:12px;line-height:1.5;}
.ad-item{display:flex;gap:14px;align-items:flex-start;border:1px solid var(--border);border-radius:16px;padding:14px;}
.ad-thumb{width:74px;height:74px;border-radius:14px;flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:32px;background:var(--ad-bg);}
.ad-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.ad-item-main{flex:1;min-width:0;}
.ad-item-main h4{font-size:14.5px;font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.ad-item-main p{font-size:12.5px;color:var(--text-muted);margin-top:4px;line-height:1.5;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.ad-stats{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--text-muted);}
.ad-stats b{color:var(--text);font-weight:700;}
.ad-item-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
.ad-item-btns button{font-size:12.5px;padding:7px 12px;}
@media(max-width:560px){.ad-item{flex-direction:column;}}

.hidden{display:none !important;}

/* ---------- KAMPANİYALAR ---------- */
.campaign-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;margin-top:20px;}
@media (max-width:900px){.campaign-grid{grid-template-columns:1fr;}}
.campaign-col .bigBox-head{margin-bottom:18px;}
.campaign-col .bigBox-head h2{display:flex;align-items:center;gap:8px;}
.campaign-form{display:flex;flex-direction:column;gap:14px;padding-bottom:18px;border-bottom:1px solid var(--border);margin-bottom:16px;}
.campaign-form .row2{display:flex;gap:12px;}
.campaign-form .row2 .field{flex:1;margin-bottom:0;}
.campaign-list{display:flex;flex-direction:column;gap:12px;max-height:420px;overflow-y:auto;}
.campaign-item{border:1px solid var(--border);border-radius:14px;padding:14px 16px;}
.campaign-item-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.campaign-item h4{font-size:14.5px;font-weight:700;}
.campaign-item p{font-size:12.5px;color:var(--text-muted);margin-top:6px;line-height:1.5;}
.campaign-item .campaign-dates{font-size:11.5px;color:var(--text-muted);margin-top:10px;display:flex;align-items:center;gap:6px;}
.campaign-item .campaign-foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;}

/* ---------- HELPERS ---------- */
.empty-state{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:48px 20px;color:var(--text-muted);text-align:center;gap:10px;
}
.empty-state svg{width:34px;height:34px;stroke:var(--border);}
.empty-state b{color:var(--text);font-size:13.5px;}
.empty-state span{font-size:12.5px;max-width:280px;}
.spinner{
  width:16px;height:16px;border-radius:50%;
  border:2px solid rgba(255,255,255,.4);border-top-color:#fff;
  animation:spin .7s linear infinite;flex-shrink:0;
}
.spinner.dark{border:2px solid rgba(18,20,28,.15);border-top-color:var(--accent);}
@keyframes spin{to{transform:rotate(360deg);}}

/* ---------- LOGIN SCREEN ---------- */
.login-screen{
  height:100vh;width:100%;
  display:flex;align-items:center;justify-content:center;
  background:
    radial-gradient(circle at 15% 20%, rgba(255,87,34,.16), transparent 45%),
    radial-gradient(circle at 85% 80%, rgba(255,87,34,.10), transparent 45%),
    var(--ink);
  padding:20px;
}
.login-card{
  width:100%;max-width:392px;
  background:var(--surface);
  border-radius:20px;
  padding:34px 30px 28px;
  box-shadow:0 24px 60px rgba(0,0,0,.35);
}
.login-logo{display:flex;align-items:center;gap:10px;margin-bottom:22px;}
.login-title{font-size:20px;font-weight:700;margin-bottom:4px;}
.login-sub{font-size:13px;color:var(--text-muted);margin-bottom:24px;}
.login-field{margin-bottom:14px;}
.login-field label{font-size:12.5px;font-weight:600;color:var(--text-muted);display:block;margin-bottom:6px;}
.login-field input{
  width:100%;padding:12px 13px;border-radius:10px;border:1px solid var(--border);
  font-size:14px;outline:none;background:var(--bg);
}
.login-field input:focus{border-color:var(--accent);background:var(--surface);}
.login-error{
  background:var(--danger-soft);color:var(--danger);font-size:12.5px;font-weight:600;
  padding:10px 12px;border-radius:9px;margin-bottom:14px;display:none;
}
.login-error.show{display:block;}
.login-submit{
  width:100%;padding:13px;background:var(--accent);color:#fff;border:none;border-radius:10px;
  font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;
  transition:background .15s ease;margin-top:6px;
}
.login-submit:hover{background:var(--accent-dark);}
.login-submit:disabled{opacity:.65;cursor:not-allowed;}
.login-toggle{text-align:center;margin-top:16px;font-size:12.5px;color:var(--text-muted);}
.login-toggle button{background:none;border:none;color:var(--accent-dark);font-weight:700;cursor:pointer;font-size:12.5px;text-decoration:underline;}

/* ---------- MODALS ---------- */
.modal-overlay{
  position:fixed;inset:0;background:rgba(18,20,28,.5);
  display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;
}
.modal{
  width:100%;max-width:420px;background:var(--surface);border-radius:18px;
  padding:26px;box-shadow:0 24px 60px rgba(0,0,0,.3);
  max-height:90vh;overflow-y:auto;
}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
.modal-head h3{font-size:16.5px;font-weight:700;}
.modal-close{
  width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:var(--surface);
  cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.modal-close svg{width:14px;height:14px;stroke:var(--text-muted);}
.modal-body .field{margin-bottom:14px;}
.modal-body .hint{font-size:11.5px;color:var(--text-muted);margin-top:-8px;margin-bottom:14px;}
.modal-footer{display:flex;justify-content:flex-end;gap:10px;margin-top:8px;}

/* ---------- TOASTS ---------- */
.toast-container{position:fixed;bottom:22px;right:22px;display:flex;flex-direction:column;gap:10px;z-index:400;max-width:320px;}
.toast{
  background:var(--ink);color:#fff;padding:13px 16px;border-radius:12px;
  font-size:13px;font-weight:600;box-shadow:0 12px 28px rgba(0,0,0,.25);
  display:flex;align-items:center;gap:10px;
  animation:toastIn .25s ease;
}
.toast.success{background:#123420;}
.toast.error{background:#3A1220;}
@keyframes toastIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

/* ---------- MAP INTERACTION ---------- */
.map-wrap{position:relative;}
#courierMap{width:100%;height:540px;border-radius:14px;overflow:hidden;background:var(--bg);z-index:1;}
.map-legend{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:14px;}
.map-legend .item{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text-muted);font-weight:600;}
.map-legend .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.map-legend .dot.online{background:var(--success);box-shadow:0 0 0 3px var(--success-soft);}
.map-legend .dot.offline{background:var(--text-muted);box-shadow:0 0 0 3px var(--border);}
.sim-toggle{
  margin-left:auto;padding:9px 15px;border-radius:9px;border:1px solid var(--border);
  background:var(--surface);color:var(--text);font-size:12.5px;font-weight:700;cursor:pointer;
  display:inline-flex;align-items:center;gap:8px;transition:background .15s ease,border-color .15s ease;
}
.sim-toggle .pulse{width:8px;height:8px;border-radius:50%;background:var(--text-muted);flex-shrink:0;}
.sim-toggle.active{border-color:var(--accent);color:var(--accent-dark);background:var(--accent-soft);}
.sim-toggle.active .pulse{background:var(--accent);animation:pulse 1s ease infinite;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,87,34,.5);}100%{box-shadow:0 0 0 8px rgba(255,87,34,0);}}
.courier-popup{font-family:'Inter',sans-serif;min-width:180px;}
.courier-popup h4{font-family:'Sora',sans-serif;font-size:14px;margin-bottom:4px;}
.courier-popup .meta{font-size:12px;color:var(--text-muted);margin-bottom:8px;}
.leaflet-popup-content-wrapper{border-radius:12px;}

@media(max-width:900px){
  .hamburger { display: block; }
  .sidebar {
    position: fixed;
    left: -260px;
    top: 0; bottom: 0;
    width: 252px;
  }
  .sidebar.open { left: 0; }
  .sidebar-overlay.show { display: block; }
  
  .logo-text, .nav-label, .menu button span, .sidebar-footer, .menu button .nav-badge { display: block; }
  .menu button { justify-content: flex-start; }
  .profile-text { display: none; }
}

/* ---------- admin6 ƏLAVƏ STİLLƏR ---------- */
.verified-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;background:var(--success-soft);color:var(--success);}
.unverified-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;background:var(--warning-soft);color:var(--warning);}
.entity-sub{font-size:12px;color:var(--text-muted);margin-top:2px;}
.mini-map-pick{height:220px;border-radius:12px;overflow:hidden;margin-bottom:14px;border:1px solid var(--border);}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin-bottom:14px;}
.detail-grid .dlabel{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.03em;}
.detail-grid .dval{font-size:13.5px;font-weight:600;color:var(--text);margin-top:2px;}
.items-table{width:100%;font-size:13px;border-top:1px solid var(--border);margin-top:10px;padding-top:10px;}
.items-table div{display:flex;justify-content:space-between;padding:4px 0;}
.progress-track{height:6px;background:var(--border);border-radius:6px;overflow:hidden;margin-top:8px;}
.progress-fill{height:100%;background:var(--accent);border-radius:6px;transition:width .3s;}
.tiny-btn{font-size:11.5px;padding:5px 9px;border-radius:8px;border:1px solid var(--border);background:#fff;cursor:pointer;font-weight:600;color:var(--text);}
.tiny-btn:hover{background:var(--bg);}
.search-address-row{display:flex;gap:8px;margin-bottom:10px;}
.search-address-row input{flex:1;}
.field-hint{font-size:11.5px;color:var(--text-muted);margin-top:-8px;margin-bottom:12px;}
.section-divider{border-top:1px solid var(--border);margin:16px 0;padding-top:16px;}
.stat-pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--accent-soft);color:var(--accent-dark);margin-left:6px;}

/* ---------- Qazanc qutusu, kart sətri, qəza xəbərdarlığı ---------- */
.earn-box{margin-top:10px;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--bg);font-size:12px;display:flex;flex-direction:column;gap:5px;}
.earn-box > div{display:flex;justify-content:space-between;gap:8px;color:var(--text-muted);}
.earn-box > div b{color:var(--text);font-weight:700;}
.earn-box .minus b{color:var(--danger);}
.earn-b
